[package]
name = "latex-renderer-backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "latex-renderer-backend"
path = "src/main.rs"

[[bin]]
name = "latex-renderer-worker"
path = "src/bin/worker.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
dotenvy = "0.15"
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "migrate", "json", "derive", "macros"] }
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["serde", "parsing"] }
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }

[dev-dependencies]
http-body-util = "0.1"
tower = "0.5"
